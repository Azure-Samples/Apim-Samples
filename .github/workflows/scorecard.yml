name: OpenSSF Scorecard

on:
  # Manual runs still only publish from the default branch — the Scorecard
  # API rejects OIDC tokens issued for non-default refs.
  workflow_dispatch:
  # Only the default branch is supported by scorecard-action.
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    # Weekly, Saturdays at 01:30 UTC.
    - cron: '30 1 * * 6'

# Workflow-level default is read-only. The analysis job elevates only
# security-events (SARIF upload) and id-token (OIDC for publish_results).
# publish_results:true is required for the README badge — the Scorecard
# API rejects results from workflows that don't meet its restrictions
# (no top-level env/defaults, no other job holding id-token:write).
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the Code Scanning dashboard.
      security-events: write
      # Needed to publish results to api.scorecard.dev (powers the badge).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Optional: keeps the raw SARIF for 5 days for debugging.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Optional: populates Security > Code scanning alerts with per-check findings.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
