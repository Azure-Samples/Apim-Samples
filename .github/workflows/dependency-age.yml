name: Dependency Age

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Enforce seven-day waiting period
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify dependency release ages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 setup/verify_dependency_age.py --scope all
