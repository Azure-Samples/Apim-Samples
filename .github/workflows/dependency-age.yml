name: Dependency Age

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Enforce seven-day waiting period
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify dependency release ages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 setup/verify_dependency_age.py --scope all
