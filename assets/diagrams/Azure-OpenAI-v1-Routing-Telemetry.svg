  <g id="cell-title">
    <text x="24.0" y="45.8" font-family="Arial, Helvetica, sans-serif" font-size="28.0" font-weight="700" fill="#172B4D" text-anchor="start">6. Correlate safe error evidence with existing telemetry</text>
  </g>
  <g id="cell-summary">
    <text x="24.0" y="83.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#334155" text-anchor="start">The report prints sanitized ProbeResult fields. Trace verification is a separate manual Logs query.</text>
  </g>
  <g id="cell-local">
    <rect x="24.0" y="108.0" width="320.0" height="48.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" />
    <text x="184.0" y="138.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Local rejection trace</text>
  </g>
  <g id="cell-upstream">
    <rect x="24.0" y="174.0" width="320.0" height="48.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" />
    <text x="184.0" y="204.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Upstream HTTP error trace</text>
  </g>
  <g id="cell-gateway">
    <rect x="24.0" y="240.0" width="320.0" height="48.0" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" />
    <text x="184.0" y="270.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Gateway on-error trace</text>
  </g>
  <g id="cell-insights">
    <rect x="466.0" y="153.0" width="340.0" height="90.0" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" />
    <text x="636.0" y="180.9" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Existing Application Insights</text>
    <text x="636.0" y="204.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Reuse the infrastructure logger</text>
    <text x="636.0" y="227.7" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">No prompt / body capture</text>
