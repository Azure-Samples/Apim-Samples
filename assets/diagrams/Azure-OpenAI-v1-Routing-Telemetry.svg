<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">6. Correlate safe error evidence with existing telemetry</title>
  <desc id="description">The report prints sanitized ProbeResult fields. Trace verification is a separate manual Logs query. Subscription-key and unmatched-operation failures happen before these policy traces. Use gateway/request diagnostics for those failures; allow time for Application Insights ingestion.</desc>
  <metadata>Source: Azure-OpenAI-v1-Routing.drawio; page: 6 Telemetry</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="1280" height="360" fill="#FFFFFF" />
  <g id="cell-local-insights">
    <path d="M 344 132 L 466 198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  </g>
  <g id="cell-upstream-insights">
    <path d="M 344 198 L 466 198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  </g>
  <g id="cell-gateway-insights">
    <path d="M 344 264 L 466 198" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  </g>
