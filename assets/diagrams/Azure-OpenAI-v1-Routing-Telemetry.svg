    <text x="1092.0" y="180.9" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">routing-errors.kql</text>
    <text x="1092.0" y="204.3" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="400" fill="#172B4D" text-anchor="middle">Filter by the error request_id</text>
