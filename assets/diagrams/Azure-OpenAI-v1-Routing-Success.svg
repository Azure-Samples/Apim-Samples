<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">3. Prove a known route returns real generated text</title>
  <desc id="description">Concrete example: recommended API with a validated priority subscription. Pool names omit the namespace. The body names the same known deployment. Repeat for both models and both POST operations. Changing only the validated subscription changes the expected family, not the request body or API path.</desc>
